  "bio": {
    "title": "Victory, Whatever the Cost",
    "paragraphs": [
      "A mercenary who has served the Kharos Dominion for longer than most can remember, R carries almost no past with him. The only story anyone tells is the Siege of Marston, a heavily garrisoned Valkyrion city ruled by a Captain who was among the Emperor's most trusted confidants. R's contract was simple and considered impossible: seize the relic kept within the Captain's keep.",
      "He split his company in two and told each half the same lie: while the other group created a diversion, they would strike the city's true weak point. When the siege began, both groups breached the walls and charged, each believing the other was the bait. Neither knew the truth: both were the diversion. While the garrison turned to face them, R slipped alone through the old tunnels beneath the city, carved his way through the Captain's personal guard, killed him and vanished underground with the relic.",
      "When he returned to the field to sound the retreat, he found exactly what he had expected: his entire company lay dead. The mission had succeeded; every one of his men had paid for it. The guilt tore at him, yet he kept repeating that it had been for the greater good, until, years later, his conscience finally fell silent. The relic, a sword and shield able to fuse into a single great axe, was later granted to him by the Warchief himself in recognition of a mission no one believed could be done. Since that day, when asked his name, he answers only \"R\". No one knows what the letter stands for, and he has never offered to explain, yet it is the only name he answers to. Those who see him on the battlefield soon understand why it is all he needs: to win, at any cost."
    ]
