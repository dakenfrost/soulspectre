<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOULSPECTRE | Result Alignment</title>
    <style>
        :root {
            --bg-color: #0a0a0a;
            --container-bg: #111113;
            --border-color: #222227;
            --text-color: #e0e0e0;
            --text-muted: #777785;
            --accent-color: #5c9ce6;
            --button-bg: #18181c;
            --button-hover: #22222a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 40px 20px;
        }

        .result-container {
            background-color: var(--container-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            max-width: 750px;
            width: 100%;
            padding: 40px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.7);
            text-align: center;
        }

        .faction-img-wrapper {
            width: 100%;
            height: 250px;
            background-color: #1a1a1f;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            margin-bottom: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .faction-img-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .result-label {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: var(--text-muted);
            margin-bottom: 10px;
        }

        .faction-name {
            font-size: 2.5rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 4px;
            color: #fff;
            margin-bottom: 20px;
            text-shadow: 0 0 20px rgba(92, 156, 230, 0.2);
        }

        .faction-description {
            font-size: 1.1rem;
            line-height: 1.6;
            color: #cccccc;
            margin-bottom: 40px;
            text-align: left;
            padding: 0 10px;
        }

        /* STRUTTURA GRAFICO COMPARATIVO */
        .chart-section {
            border-top: 1px solid var(--border-color);
            padding-top: 30px;
            margin-bottom: 40px;
            text-align: left;
        }

        .chart-title {
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--text-color);
            margin-bottom: 20px;
        }

        .chart-row {
            display: flex;
            align-items: center;
            margin-bottom: 14px;
            gap: 15px;
        }

        .bar-label {
            width: 130px;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
            color: #b0b0b5;
        }

        .bar-container {
            flex-grow: 1;
            height: 12px;
            background-color: #1a1a1f;
            border: 1px solid #25252a;
            border-radius: 2px;
            overflow: hidden;
        }

        .bar-fill {
            height: 100%;
            background-color: var(--accent-color);
            width: 0%;
            transition: width 1s cubic-bezier(0.1, 0.8, 0.2, 1);
        }

        .bar-score {
            width: 30px;
            font-size: 0.9rem;
            text-align: right;
            font-weight: bold;
            color: var(--text-muted);
        }

        /* PULSANTI DI NAVIGAZIONE */
        .nav-block {
            display: flex;
            gap: 15px;
            justify-content: center;
        }

        .nav-btn {
            display: inline-block;
            background-color: var(--button-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 14px 28px;
            border-radius: 4px;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: all 0.2s ease;
        }

        .nav-btn:hover {
            background-color: var(--button-hover);
            border-color: var(--accent-color);
            color: #fff;
        }

        .nav-btn.primary {
            border-color: var(--accent-color);
            background-color: rgba(92, 156, 230, 0.05);
        }

        .nav-btn.primary:hover {
            background-color: rgba(92, 156, 230, 0.15);
        }

        @media (max-width: 600px) {
            .nav-block {
                flex-direction: column;
            }
            .nav-btn {
                width: 100%;
                text-align: center;
            }
            .bar-label {
                width: 100px;
                font-size: 0.8rem;
            }
        }
    </style>
</head>
<body>

<div class="result-container">
    <div class="faction-img-wrapper">
        <img id="faction-banner" src="../img/homepage_bg.jpg" alt="Faction Banner">
    </div>

    <div id="ui-label" class="result-label">Alignment Result</div>
    <div id="ui-faction-name" class="faction-name">Faction</div>
    <div id="ui-description" class="faction-description">Processing tactical analysis...</div>

    <div class="chart-section">
        <div id="ui-chart-title" class="chart-title">Ideological Breakdown</div>
        <div id="chart-rows-container"></div>
    </div>

    <div class="nav-block">
        <a id="ui-faction-link" href="../factions/index.html" class="nav-btn primary">Visit Faction Page</a>
        <a id="ui-home-link" href="../index.html" class="nav-btn">Back to Home</a>
    </div>
</div>

<script>
    // Database dei testi e della lore delle fazioni per il report di output (Bilingue)
    const factionProfiles = {
        en: {
            label: "You belong to:",
            chartTitle: "Ideological Breakdown",
            btnFaction: "Visit Faction Page",
            btnHome: "Back to Home",
            factions: {
                K: { name: "Kharos", desc: "You don't fear conflict; for you, it is the fundamental engine of growth. Any obstacle in your path will soon regret standing in your way. You are a person of iron will, ready to get your hands dirty to seize everything life has to offer. Kharos is your domain: free from the shackles of 'morality', it is just you and your raw strength against the world. Prove your true value, and nothing will be able to stop you.", link: "../factions/kharos.html" },
                V: { name: "Valkyrion", desc: "You see the world for what it is: a silent void. Yet, you refuse to let that turn you into a beast. You carry the burden of the anti-nihilist, choosing order, duty, and solidarity not because a god demands it, but because it is the only way to make this mortal journey dignified. Valkyrion is for those who hold the line, fighting for the future even when the present offers no hope.", link: "../factions/valkyrion.html" },
                D: { name: "Diavoli", desc: "You have transcended the need for brute strength. You look at the void and see a chess board waiting to be played. You are a master of systems and contracts, capable of turning chaos into a resource. In your domain, success is not won by sweat, but by precision. You don't need to be the strongest; you just need to be the one who owns the rules everyone else follows.", link: "../factions/diavoli.html" },
                N: { name: "Nani", desc: "You have realized that the individual is but a fleeting flicker. Your greatness lies in the collective. You find your purpose by merging your soul with the monumental machinery of the state and the people. You are the rock upon which progress is built. With you, the collective never fails, and the work, eternal and indifferent to time, will always outlast your own brief existence.", link: "../factions/nani.html" },
                I: { name: "Isolazionisti", desc: "You are the Architect of your own Silence. You understand that the world's chaos is a tax you refuse to pay. By stepping outside the game, you reclaim your most precious resource: your peace. Your strength lies in your independence; you are the horizon that cannot be reached and the storm that has decided not to rage, simply because you don't need the validation of the arena.", link: "../factions/isolazionista.html" },
                M: { name: "Dimenticati", desc: "You carry a lantern in the darkness, not to conquer it, but to show the way to those who have lost their path. You know that pain is the only truth, but connection is the only cure. Your strength is not in conquest, but in the radical, dangerous act of caring when it is easier to be cold. In your sanctuary, wounds aren't hidden—they are finally allowed to heal.", link: "../factions/forgottens.html" }
            }
        },
        it: {
            label: "Fai parte dei:",
            chartTitle: "Ripartizione Ideologica",
            btnFaction: "Visita Pagina Fazione",
            btnHome: "Torna alla Home",
            factions: {
                K: { name: "Kharos", desc: "Non hai paura del conflitto, anzi: per te è parte fondamentale della crescita e qualsiasi ostacolo davanti a te rimpiangerà di essersi messo in mezzo. Sei una persona forte e determinata che non ha paura di sporcarsi le mani per ottenere il massimo che la vita ha da offrire. Il dominio di Kharos è fatto apposta per te: libero dai gioghi morali, ci sei solo tu e la tua forza contro quella di chiunque altro. Dimostra il tuo valore e nessuno potrà fermarti.", link: "../factions/kharos.html" },
                V: { name: "Valkyrion", desc: "Vedi il mondo per ciò che è: un vuoto silenzioso. Eppure, ti rifiuti di trasformarti in una bestia. Porti sulle spalle il peso dell'anti-nichilista, scegliendo il dovere, la disciplina e la solidarietà non perché qualcuno te lo imponga, ma perché è l'unico modo per rendere questo viaggio mortale degno di essere vissuto. Valkyrion è per chi tiene la linea, combattendo per il futuro anche quando il presente non offre alcuna speranza.", link: "../factions/valkyrion.html" },
                D: { name: "Diavoli", desc: "Hai superato il bisogno della forza bruta. Guardi il vuoto e vedi una scacchiera che attende di essere giocata. Sei un maestro di sistemi e contratti, capace di convertire il caos in risorsa. Nel tuo dominio, il successo non si ottiene col sudore, ma con la precisione. Non hai bisogno di essere il più forte; ti basta essere colui che possiede le regole che tutti gli altri sono costretti a seguire.", link: "../factions/diavoli.html" },
                N: { name: "Nani", desc: "Hai compreso che l'individuo è solo un lampo passeggero. La tua grandezza risiede nel collettivo. Trovi il tuo scopo fondendo la tua anima con la monumentale macchina dello Stato e della produzione. Sei la roccia su cui è costruito il progresso. Con te, il gruppo non fallisce mai, e il lavoro, eterno e indifferente al tempo, durerà sempre più della tua breve esistenza.", link: "../factions/nani.html" },
                I: { name: "Isolazionisti", desc: "Sei l'architetto del tuo Silenzio. Hai capito che il caos del mondo è una tassa che ti rifiuti di pagare. Uscendo dal gioco, riprendi possesso della tua risorsa più preziosa: la tua pace. La tua forza risiede nell'indipendenza; sei l'orizzonte che non può essere raggiunto e la tempesta che ha deciso di non infuriare, semplicemente perché non hai bisogno della validazione dell'arena.", link: "../factions/isolazionista.html" },
                M: { name: "Dimenticati", desc: "Porti una lanterna nell'oscurità, non per conquistarla, ma per mostrare la strada a chi ha perso la via. Sai che il dolore è l'unica verità, ma la connessione è l'unica cura. La tua forza non è nella conquista, ma nell'atto radicale e pericoloso di prenderti cura degli altri quando è più facile essere freddi. Nel tuo santuario, le ferite non vengono nascoste: finalmente possono guarire.", link: "../factions/forgottens.html" }
            }
        }
    };

    // Estrazione parametri URL
    const urlParams = new URLSearchParams(window.location.search);
    
    // Determina lingua (default EN)
    let lang = urlParams.get('ln');
    if (!lang || !factionProfiles[lang]) {
        lang = 'en';
    }

    // Mappa dei punteggi estratti
    const keys = ['K', 'V', 'D', 'N', 'I', 'M'];
    const scores = {};
    let winnerCode = 'K';
    let maxScore = -1;

    keys.forEach(k => {
        const val = parseInt(urlParams.get(k) || 0);
        scores[k] = val;
        // Algoritmo di rilevamento vincitore assoluto/dominante
        if (val > maxScore) {
            maxScore = val;
            winnerCode = k;
        }
    });

    // Aggiornamento Elementi UI statici in base alla lingua
    const currentTextSet = factionProfiles[lang];
    document.getElementById('ui-label').textContent = currentTextSet.label;
    document.getElementById('ui-chart-title').textContent = currentTextSet.chartTitle;
    document.getElementById('ui-faction-link').textContent = currentTextSet.btnFaction;
    document.getElementById('ui-home-link').textContent = currentTextSet.btnHome;

    // Assegnazione dati Fazione Vincitrice
    const winnerProfile = currentTextSet.factions[winnerCode];
    document.getElementById('ui-faction-name').textContent = winnerProfile.name;
    document.getElementById('ui-description').textContent = winnerProfile.desc;
    document.getElementById('ui-faction-link').href = winnerProfile.link;

    // Se hai immagini specifiche di fazione (es: img/faction_K.png), puoi de-commentare la riga sotto:
    // document.getElementById('faction-banner').src = `../img/btn_${winnerProfile.name.toLowerCase()}.png`;

    // Costruzione dinamica del Grafico Comparativo in fondo alla pagina
    const chartContainer = document.getElementById('chart-rows-container');
    const totalQuestions = 8;

    keys.forEach(k => {
        const score = scores[k];
        const percentage = (score / totalQuestions) * 100;
        const factionName = currentTextSet.factions[k].name;

        const row = document.createElement('div');
        row.className = 'chart-row';
        row.innerHTML = `
            <div class="bar-label">${factionName}</div>
            <div class="bar-container">
                <div class="bar-fill" id="bar-${k}"></div>
            </div>
            <div class="bar-score">${score}</div>
        `;
        chartContainer.appendChild(row);

        // Attiva l'animazione della barra con un leggero ritardo d'esecuzione temporale
        setTimeout(() => {
            const fillEl = document.getElementById(`bar-${k}`);
            if (fillEl) fillEl.style.width = `${percentage}%`;
        }, 100);
    });
</script>

</body>
</html>
