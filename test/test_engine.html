<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SoulSpectre - Archetype Alignment Test</title>
    <style>
        :root {
            --bg-color: #121214;
            --container-bg: #1a1a1e;
            --border-color: #2d2d34;
            --text-color: #e2e2e9;
            --text-muted: #8e8e9f;
            --accent-color: #a3333d;
            --accent-hover: #c43e4a;
            --button-bg: #222227;
            --button-hover: #2a2a32;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .test-container {
            background-color: var(--container-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            max-width: 650px;
            width: 100%;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .header {
            margin-bottom: 30px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-size: 1.4rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--text-color);
        }

        .progress-container {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .progress {
            font-size: 0.9rem;
            color: var(--text-muted);
            font-weight: 600;
        }

        .question-text {
            font-size: 1.15rem;
            line-height: 1.6;
            margin-bottom: 30px;
            font-weight: 500;
        }

        .options-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option-btn {
            background-color: var(--button-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 16px 20px;
            border-radius: 6px;
            text-align: left;
            font-size: 0.95rem;
            line-height: 1.4;
            cursor: pointer;
            transition: all 0.2s ease;
            width: 100%;
        }

        .option-btn:hover {
            background-color: var(--button-hover);
            border-color: var(--accent-color);
        }

        .option-btn:active {
            transform: scale(0.99);
        }

        .lang-dropdown {
            background-color: var(--button-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            outline: none;
            transition: border-color 0.2s;
        }

        .lang-dropdown:hover {
            border-color: var(--text-muted);
        }

        .lang-dropdown option {
            background-color: var(--container-bg);
            color: var(--text-color);
        }

        @media (max-width: 480px) {
            .test-container {
                padding: 20px;
            }
            .question-text {
                font-size: 1rem;
            }
            .option-btn {
                font-size: 0.9rem;
                padding: 12px 16px;
            }
        }
    </style>
</head>
<body>

<div class="test-container">
    <div class="header">
        <h1 id="title-text">SoulSpectre Test</h1>
        <div class="progress-container">
            <span id="progress-indicator" class="progress">0 / 8</span>
            <select id="lang-select" class="lang-dropdown">
                <option value="en">EN</option>
                <option value="it">IT</option>
            </select>
        </div>
    </div>

    <div id="quiz-body">
        <div id="question-el" class="question-text">Loading question...</div>
        <div id="options-el" class="options-list"></div>
    </div>
</div>
